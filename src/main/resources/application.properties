
server.port=8080
spring.application.name=mercaditolibre

#Conexion a base de datos
spring.datasource.url=jdbc:mysql://localhost:3307/mercaditolibre_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#configuracion de jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##configuracion global de cors para react
spring.mvc.cors.allowed-origins=https://localhost:5173
spring.mvc.cors.allowed-methods=GET, POST, PUT, DELETE, OPTIONS

#Propiedades de seguridad / JWT (clave  de 256 bits en hexadecimal)
app.jwt.secret=8f3a9c2e1b7d4f6a5c8e9b2d1f4a7c3e6b9d2f5a8c1e4b7d3f6a9c2e5b8d1f4a
app.jwt.expiration-ms=86400000

